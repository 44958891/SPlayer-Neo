    fill="#FFFFFF"
    text-anchor="middle"
    letter-spacing="0.5"
  >
    HQ
  </text>

  <!-- 星形装饰 - 更清晰 -->
  <path
    d="M 10 10 L 11 13 L 14 13 L 11.5 15 L 12.5 18 L 10 16 L 7.5 18 L 8.5 15 L 6 13 L 9 13 Z"
    fill="#FFFFFF"
    opacity="0.5"
  />
</svg>
